<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SciTranslate - Dịch Song Ngữ với Gemini AI</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- PDF.js for reading PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pdfjs = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
            if (pdfjs) {
                pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            }
        });
    </script>

    <!-- Mammoth.js for reading Word DOCX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

    <style>
        :root {
            --bg-color: #17a2b8;
            --text-main: #ffffff;
            --text-muted: #cffafe;
            --primary: #22d3ee;
            --primary-hover: #b8c01a;
            --secondary: #67e8f9;
            --card-bg: rgba(255, 255, 255, 0.15);
            --card-border: rgba(255, 255, 255, 0.3);
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Background */
        .ambient-light {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            animation: float 15s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: rgba(99, 102, 241, 0.4);
            top: -150px;
            left: -150px;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: rgba(236, 72, 153, 0.3);
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(100px, 50px) scale(1.1);
            }
        }

        nav {
            padding: 20px 50px;
            border-bottom: 1px solid var(--card-border);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .container {
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        p.subtitle {
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .app-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .upload-area {
            border: 2px dashed var(--primary);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-area:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: #fff;
            transform: translateY(-2px);
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        #file-input {
            display: none;
        }

        .settings-area {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--card-border);
        }

        .file-info i {
            font-size: 1.5rem;
            color: var(--primary);
        }

        .file-details {
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .file-size {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .engine-controls {
            margin-bottom: 20px;
        }

        .lang-select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
            font-family: inherit;
        }

        .lang-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .lang-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
        }

        /* Gemini Login Area */
        .gemini-auth {
            display: none;
            background: rgba(99, 102, 241, 0.05);
            border: 1px dashed var(--primary);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease forwards;
        }

        .gemini-auth input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            outline: none;
            font-family: monospace;
        }

        .gemini-auth input:focus {
            border-color: var(--primary);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        .btn-outline.danger {
            border-color: #ef4444;
            color: #ef4444;
        }

        .btn-outline.danger:hover {
            background: #ef4444;
            color: white;
        }

        .btn-outline.warning {
            border-color: #eab308;
            color: #eab308;
        }

        .btn-outline.warning:hover {
            background: #eab308;
            color: #0f172a;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
        }

        /* Live Area */
        .live-area {
            display: none;
            width: 100%;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s ease;
        }

        .bilingual-output {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .fullscreen-mode {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            margin: 0 !important;
            border-radius: 0 !important;
            z-index: 9999 !important;
            display: flex;
            flex-direction: column;
            box-sizing: border-box !important;
            overflow: hidden !important;
        }

        .fullscreen-mode .live-area {
            display: flex !important;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .fullscreen-mode .bilingual-output {
            max-height: none !important;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding-bottom: 20px;
        }

        .bilingual-output::-webkit-scrollbar {
            width: 8px;
        }

        .bilingual-output::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .bilingual-output::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .hover-sentence {
            transition: background-color 0.2s, color 0.2s;
            border-radius: 4px;
            cursor: pointer;
        }

        .hover-sentence:hover,
        .hover-sentence.highlight {
            background-color: rgba(234, 179, 8, 0.3);
            color: #ffffff;
            box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.3);
        }

        .bilingual-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            animation: fadeIn 0.5s ease forwards;
        }

        .source-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            text-align: justify;
            white-space: pre-wrap;
        }

        .target-text {
            color: var(--text-main);
            font-size: 1.05rem;
            line-height: 1.6;
            font-weight: 500;
            text-align: justify;
            white-space: pre-wrap;
        }

        .loading-text {
            color: var(--primary);
            font-style: italic;
        }

        .btn-success {
            width: 100%;
            background: var(--success);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            display: none;
            transition: 0.3s;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .error-text {
            color: #ef4444;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--card-border);
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <div class="ambient-light">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <nav>
        <div class="logo" onclick="location.reload()" style="cursor: pointer; transition: opacity 0.2s;"
            onmouseover="this.style.opacity=0.8" onmouseout="this.style.opacity=1">
            <i class="fa-solid fa-language"></i> SciTranslate Song Ngữ
            <span
                style="font-size: 0.5em; font-weight: 400; -webkit-text-fill-color: var(--text-muted); margin-top: 6px;">design
                by PGA</span>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1 onclick="location.reload()" style="cursor: pointer; display: inline-block; transition: opacity 0.2s;"
                onmouseover="this.style.opacity=0.8" onmouseout="this.style.opacity=1">Dịch Báo Khoa Học<br>Sang Song
                Ngữ</h1>
        </header>

        <div class="app-card">
            <!-- Upload View -->
            <div class="upload-area" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <i class="fa-solid fa-file-arrow-up upload-icon"></i>
                <div style="font-size: 1.2rem; font-weight: 500; margin-bottom: 8px;">Nhấp để tải lên hoặc kéo thả tệp
                    vào đây</div>
                <div style="color: var(--text-muted); font-size: 0.9rem;">Hỗ trợ .pdf, .docx</div>
            </div>
            <input type="file" id="file-input" accept=".pdf,.docx">

            <!-- Settings View -->
            <div class="settings-area" id="settings-area">
                <div class="file-info">
                    <i class="fa-solid fa-file-lines" id="file-icon"></i>
                    <div class="file-details">
                        <div class="file-name" id="file-name">document.pdf</div>
                        <div class="file-size" id="file-size">2.5 MB</div>
                    </div>
                </div>

                <!-- Engine Selection -->
                <div class="engine-controls">
                    <label class="form-label">🤖 Bộ não Dịch thuật (AI Engine)</label>
                    <select class="lang-select" id="engine-select" onchange="toggleEngine()">
                        <option value="google">🌐 Google Translate (Cơ bản, Dịch siêu tốc, Không cần đăng nhập)</option>
                        <option value="gemini-3-1-flash-lite">⚡ Gemini 3.1 (15 câu/phút, 500
                            câu/ngày)</option>
                    </select>
                </div>

                <!-- Gemini Auth Section -->
                <div class="gemini-auth" id="gemini-key-box">
                    <label id="gemini-key-label">Cấu hình Gemini API Key
                        <a href="https://aistudio.google.com/app/apikey" target="_blank" class="get-key-link"
                            id="gemini-key-link">(Lấy Key miễn phí)</a>
                    </label>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; line-height: 1.5;">
                        Bạn có thể nhập nhiều API Key cùng lúc để tăng tốc độ dịch.
                    </p>

                    <div style="margin-bottom: 15px; display: flex; align-items: center;">
                        <label for="api-key-count" style="font-size: 0.9rem; margin-right: 10px;">Số lượng Key:</label>
                        <select id="api-key-count" class="form-control" style="width: 80px; padding: 5px;"
                            onchange="renderApiKeyInputs()">
                            <option value="1">1 Key</option>
                            <option value="2">2 Keys</option>
                            <option value="3">3 Keys</option>
                            <option value="4">4 Keys</option>
                            <option value="5">5 Keys</option>
                            <option value="6">6 Keys</option>
                        </select>
                    </div>

                    <div id="api-key-inputs-container">
                        <!-- JS Render Inputs Here -->
                    </div>

                    <div style="margin-top: 15px; display: flex; gap: 10px;">
                        <button type="button" class="btn btn-secondary" onclick="saveGeminiKey()"
                            style="padding: 8px 15px; border-radius: 6px; border: none; background: var(--primary); color: white; cursor: pointer; font-weight: 500;">Lưu
                            Key</button>
                        <button type="button" class="btn btn-outline" id="logout-btn" onclick="logoutGemini()"
                            style="display: none; padding: 8px 15px; border-radius: 6px; border: 1px solid var(--secondary); background: transparent; color: var(--secondary); cursor: pointer; font-weight: 500;">Xóa
                            toàn bộ Key</button>
                    </div>
                </div>

                <!-- Language Selection -->
                <label class="form-label">🌍 Ngôn ngữ</label>
                <div class="lang-group">
                    <select class="lang-select" id="source-lang">
                        <option value="en">Tiếng Anh</option>
                        <option value="vi">Tiếng Việt</option>
                        <option value="auto">Tự động</option>
                    </select>
                    <i class="fa-solid fa-arrow-right" style="color: var(--text-muted);"></i>
                    <select class="lang-select" id="target-lang">
                        <option value="vi">Tiếng Việt</option>
                        <option value="en">Tiếng Anh</option>
                    </select>
                </div>

                <button class="btn-primary" onclick="startTranslation()">
                    <i class="fa-solid fa-play"></i> Bắt đầu Trích xuất & Dịch
                </button>
            </div>

            <!-- Live Translation View -->
            <div class="live-area" id="live-area">
                <div class="progress-header">
                    <span id="status-text" style="font-weight: 500; color: var(--primary);">Đang xử lý...</span>
                    <div>
                        <span id="progress-text"
                            style="color: var(--text-muted); font-size: 0.9rem; margin-right: 10px;">0%</span>
                        <button onclick="toggleFullscreen()" id="fullscreen-btn"
                            style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; transition: color 0.2s;"
                            title="Mở rộng toàn màn hình">
                            <i class="fa-solid fa-expand" onmouseover="this.style.color='var(--primary)'"
                                onmouseout="this.style.color='var(--text-muted)'"></i>
                        </button>
                    </div>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>

                <div class="bilingual-output" id="bilingual-output"></div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button class="btn-outline warning" id="pause-btn" onclick="togglePause()"
                        style="flex: 1; display: none; font-size: 1.1rem; padding: 16px; border-radius: 12px; justify-content: center; align-items: center;">
                        <i class="fa-solid fa-pause" style="margin-right: 8px;"></i> <span id="pause-text">Tạm
                            dừng</span>
                    </button>
                    <button class="btn-success" id="download-btn" onclick="downloadBilingual()"
                        style="flex: 2; margin-top: 0;">
                        <i class="fa-solid fa-download"></i> Tải xuống (.html)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleFullscreen() {
            const appCard = document.querySelector('.app-card');
            const icon = document.querySelector('#fullscreen-btn i');
            const btn = document.querySelector('#fullscreen-btn');

            if (appCard.classList.contains('fullscreen-mode')) {
                appCard.classList.remove('fullscreen-mode');
                icon.className = 'fa-solid fa-expand';
                btn.title = "Mở rộng toàn màn hình";
            } else {
                appCard.classList.add('fullscreen-mode');
                icon.className = 'fa-solid fa-compress';
                btn.title = "Thu nhỏ màn hình";
            }
        }

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                const appCard = document.querySelector('.app-card');
                if (appCard && appCard.classList.contains('fullscreen-mode')) {
                    toggleFullscreen();
                }
            }
        });

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const settingsArea = document.getElementById('settings-area');
        const liveArea = document.getElementById('live-area');

        let bilingualResults = [];
        let isPaused = false;

        function togglePause() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pause-btn');
            const pauseText = document.getElementById('pause-text');
            const icon = pauseBtn.querySelector('i');
            const statusText = document.getElementById('status-text');

            if (isPaused) {
                pauseText.textContent = "Tiếp tục";
                icon.className = "fa-solid fa-play";
                statusText.innerHTML = '<i class="fa-solid fa-circle-pause"></i> Đã tạm dừng dịch thuật';
            } else {
                pauseText.textContent = "Tạm dừng";
                icon.className = "fa-solid fa-pause";
                statusText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang tiếp tục dịch...';
            }
        }

        function toggleEngine() {
            const engine = document.getElementById('engine-select').value;
            const geminiBox = document.getElementById('gemini-key-box');
            const isGemini = engine.startsWith('gemini');

            if (isGemini) {
                geminiBox.style.display = 'block';
                const label = document.getElementById('gemini-key-label');
                const link = document.getElementById('gemini-key-link');
                label.childNodes[0].nodeValue = "Cấu hình Gemini API Key ";
                link.href = "https://aistudio.google.com/app/apikey";

                const keysStr = localStorage.getItem('gemini_api_key');
                if (keysStr) {
                    const keys = keysStr.split(',').map(k => k.trim()).filter(k => k);
                    document.getElementById('api-key-count').value = keys.length > 0 ? (keys.length > 6 ? 6 : keys.length) : 1;
                    document.getElementById('logout-btn').style.display = 'inline-block';
                } else {
                    document.getElementById('api-key-count').value = 1;
                    document.getElementById('logout-btn').style.display = 'none';
                }
                renderApiKeyInputs();
            } else {
                geminiBox.style.display = 'none';
            }
        }

        function renderApiKeyInputs() {
            const container = document.getElementById('api-key-inputs-container');
            const count = parseInt(document.getElementById('api-key-count').value) || 1;
            const existingKeys = (localStorage.getItem('gemini_api_key') || '').split(',').map(k => k.trim()).filter(k => k);

            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const val = existingKeys[i] || '';
                container.innerHTML += `
                    <div style="margin-bottom: 10px;">
                        <input type="text" class="form-control gemini-key-input" placeholder="Nhập API Key số ${i + 1}..." value="${val}">
                    </div>
                `;
            }
        }

        function saveGeminiKey() {
            const inputs = document.querySelectorAll('.gemini-key-input');
            const keys = [];

            inputs.forEach(input => {
                const val = input.value.trim();
                if (val) keys.push(val);
            });

            if (keys.length === 0) {
                alert("Vui lòng nhập ít nhất 1 mã API Key!");
                return;
            }

            localStorage.setItem('gemini_api_key', keys.join(','));
            alert(`Đã lưu thành công ${keys.length} API Key!`);
            document.getElementById('logout-btn').style.display = 'inline-block';
        }

        function logoutGemini() {
            localStorage.removeItem('gemini_api_key');
            checkGeminiAuth();
        }

        function checkGeminiAuth() {
            const key = localStorage.getItem('gemini_api_key');
            const status = document.getElementById('auth-status');
            const input = document.getElementById('gemini-key');
            const logoutBtn = document.getElementById('logout-btn');

                status.style.color = 'var(--success)';

        // Khởi tạo kiểm tra Auth nếu tải lại trang
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof toggleGeminiAuth === 'function') toggleGeminiAuth();

            // Hover synchronization for sentences
            const outputDiv = document.getElementById('bilingual-output');
            if (outputDiv) {
                outputDiv.addEventListener('mouseover', (e) => {
                    const target = e.target.closest('.hover-sentence');
                    if (target) {
                        const idx = target.getAttribute('data-idx');
                        const box = target.closest('.bilingual-box');
                        if (box && idx !== null) {
                            box.querySelectorAll(`.hover-sentence[data-idx="${idx}"]`).forEach(el => {
                                el.classList.add('highlight');
                            });
                        }
                    }
                });

                outputDiv.addEventListener('mouseout', (e) => {
                    const target = e.target.closest('.hover-sentence');
                    if (target) {
                        const idx = target.getAttribute('data-idx');
                        const box = target.closest('.bilingual-box');
                        if (box && idx !== null) {
                            box.querySelectorAll(`.hover-sentence[data-idx="${idx}"]`).forEach(el => {
                                el.classList.remove('highlight');
                            });
                        }
                    }
                });
            }
        });

        function wrapSentences(text) {
            if (!text) return '';
            try {
                // Phân tách câu dựa trên dấu chấm, hỏi, chấm than theo sau là khoảng trắng và chữ hoa.
                const regex = /.*?[.!?](?=\s+\p{Lu}|\s*$)/gsu;
                let sentences = [];
                let lastIndex = 0;
                let match;
                while ((match = regex.exec(text)) !== null) {
                    sentences.push(match[0]);
                    lastIndex = regex.lastIndex;
                }
                if (lastIndex < text.length) {
                    sentences.push(text.substring(lastIndex));
                }
                if (sentences.length === 0) return text;

                let idx = 0;
                return sentences.map(s => `<span class="hover-sentence" data-idx="${idx++}">${s}</span>`).join('');
            } catch (e) {
                // Fallback nếu trình duyệt cũ
                const parts = text.match(/[^.!?]+[.!?]*|\s+/g) || [text];
                let idx = 0;
                return parts.map(p => {
                    if (!p.trim()) return p;
                    return `<span class="hover-sentence" data-idx="${idx++}">${p}</span>`;
                }).join('');
            }
        }


        // --- DRAG AND DROP ---
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            window.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault(); e.stopPropagation();
                dropZone.style.borderColor = '#fff'; dropZone.style.background = 'rgba(99, 102, 241, 0.15)';
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault(); e.stopPropagation();
                dropZone.style.borderColor = 'var(--primary)'; dropZone.style.background = 'rgba(99, 102, 241, 0.05)';
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); e.stopPropagation();
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFile();
            }
        });

        fileInput.addEventListener('change', handleFile);

        function handleFile() {
            if (!fileInput.files || fileInput.files.length === 0) return;
            const file = fileInput.files[0];
            const ext = file.name.split('.').pop().toLowerCase();

            if (ext === 'doc') { alert('Hệ thống chỉ hỗ trợ định dạng DOCX mới. File DOC cũ sẽ không đọc được, vui lòng lưu lại (Save As) thành DOCX nhé.'); return; }
            if (!['pdf', 'docx'].includes(ext)) { alert('Chỉ hỗ trợ file định dạng PDF hoặc DOCX. Bạn đang tải lên file có đuôi: ' + ext); return; }

            document.getElementById('file-name').textContent = file.name;
            document.getElementById('file-size').textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
            document.getElementById('file-icon').className = ext === 'pdf' ? 'fa-solid fa-file-pdf' : 'fa-solid fa-file-word';
            document.getElementById('file-icon').style.color = ext === 'pdf' ? '#ef4444' : '#3b82f6';

            dropZone.style.display = 'none';
            settingsArea.style.display = 'block';
        }

        // --- EXTRACT TEXT ---
        async function extractTextFromPDF(file) {
            const pdfjs = window['pdfjs-dist/build/pdf'] || window.pdfjsLib;
            if (!pdfjs) throw new Error('Thư viện PDF.js chưa tải xong. Vui lòng tải lại trang.');

            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjs.getDocument(arrayBuffer).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();

                let lastY = -1;
                let text = '';
                for (let item of textContent.items) {
                    if (lastY == -1 || Math.abs(item.transform[5] - lastY) > 5) {
                        text += '\n' + item.str;
                    } else {
                        text += item.str;
                    }
                    lastY = item.transform[5];
                }
                fullText += text + '\n\n';
            }
            return fullText;
        }

        async function extractTextFromDocx(file) {
            if (!window.mammoth) throw new Error('Thư viện Mammoth.js chưa tải xong. Vui lòng tải lại trang.');
            const arrayBuffer = await file.arrayBuffer();
            const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
            return result.value;
        }

        function chunkText(text, maxLength) {
            // Lọc bỏ phần References/Tài liệu tham khảo ở cuối bài
            const refRegex = /\n\s*(?:(?:[0-9]+[\.\s]*|[IVX]+[\.\s]*))?(?:REFERENCES?|BIBLIOGRAPHY|TÀI LIỆU THAM KHẢO)\s*\n/gi;
            let match;
            let lastRefIndex = -1;
            while ((match = refRegex.exec(text)) !== null) {
                // Chỉ cắt nếu nó nằm ở nửa sau của tài liệu (để tránh cắt nhầm Mục lục)
                if (match.index > text.length * 0.5) {
                    lastRefIndex = match.index;
                }
            }
            if (lastRefIndex !== -1) {
                text = text.substring(0, lastRefIndex);
                console.log("Đã tự động loại bỏ phần References.");
            }

            // Replace single newlines with space, but preserve double newlines as paragraphs
            text = text.replace(/([^\n])\n([^\n])/g, '$1 $2');
            text = text.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
            if (!text) return [];

            const sentences = text.match(/[^.!?]+[.!?]*|\n\n|\s+/g) || [text];
            const chunks = [];
            let currentChunk = '';

            for (let sentence of sentences) {
                sentence = sentence.trim();
                if (!sentence) continue;

                const lower = sentence.toLowerCase();

                // --- BỘ LỌC RÁC THÔNG MINH ---
                if (lower.includes('translations and content mining')) continue;
                if (lower.includes('republication/redistribution requires')) continue;
                if (lower.includes('authorized licensed use limited to')) continue;
                if (lower.includes('ieee.org/publications')) continue;
                if (lower.match(/©|\(c\)/) && lower.includes('ieee')) continue;
                if (lower.includes('0093-9994')) continue;
                if (sentence.startsWith('http://') || sentence.startsWith('https://')) continue;

                // --- BỘ LỌC DỮ LIỆU BẢNG BIỂU (TABLES) ---
                const numCount = (sentence.match(/\\d/g) || []).length;
                const letterCount = (sentence.match(/[a-zA-Z]/g) || []).length;

                // 1. Lọc bỏ các dòng chứa quá nhiều số so với chữ cái (đặc trưng của hàng trong bảng)
                if (numCount > 4 && letterCount < numCount * 1.5) continue;

                // 2. Lọc bỏ các mảnh vỡ dữ liệu ngắn (ví dụ "0.05", "123", "fig 1")
                if (letterCount < 6 && numCount > 0) continue;

                // 3. Chuỗi quá ngắn, không có ý nghĩa (ví dụ: "A", "-", "b.")
                if (letterCount < 4) continue;

                // 4. Lọc Table/Figure caption bị đứt gãy nếu người dùng không muốn đọc
                if (lower.match(/^(table|fig\\.|figure)\\s*\\d+$/)) continue;

                // NẾU 1 CÂU BỊ LỖI TRÍCH XUẤT (KHÔNG CÓ DẤU CHẤM) LÀM NÓ DÀI HƠN MAXLENGTH
                if (sentence.length > maxLength) {
                    if (currentChunk.trim()) {
                        chunks.push(currentChunk.trim());
                        currentChunk = '';
                    }

                    let tempStr = sentence;
                    while (tempStr.length > maxLength) {
                        let cutPos = tempStr.lastIndexOf(' ', maxLength);
                        if (cutPos === -1) cutPos = maxLength;

                        chunks.push(tempStr.substring(0, cutPos).trim());
                        tempStr = tempStr.substring(cutPos).trim();
                    }
                    if (tempStr) {
                        currentChunk = tempStr + ' ';
                    }
                }
                else if ((currentChunk + ' ' + sentence).length > maxLength) {
                    if (currentChunk.trim()) chunks.push(currentChunk.trim());
                    currentChunk = sentence + ' ';
                } else {
                    currentChunk += ' ' + sentence;
                }
            }
            if (currentChunk.trim()) chunks.push(currentChunk.trim());
            return chunks;
        }

        // --- TRANSLATE API GOOGLE ---
        async function translateGoogle(text, sl, tl) {
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                const json = await response.json();
                let translated = '';
                if (json && json[0]) {
                    json[0].forEach(segment => { if (segment[0]) translated += segment[0]; });
                }
                return translated;
            } catch (err) {
                console.error(err);
                throw new Error("Lỗi mạng khi kết nối Google Translate");
            }
        }

        // --- TRANSLATE API GEMINI ---
        async function translateGemini(text, sl, tl, retryCount = 0, model = 'gemini-flash-latest') {
            const apiKeysString = localStorage.getItem('gemini_api_key');
            if (!apiKeysString) throw new Error("Chưa có API Key của Gemini!");

            // Luân phiên sử dụng nhiều API Key (Round-robin)
            const keyList = apiKeysString.split(',').map(k => k.trim()).filter(k => k);
            if (typeof window.currentApiKeyIndex === 'undefined') window.currentApiKeyIndex = 0;
            const apiKey = keyList[window.currentApiKeyIndex % keyList.length];
            window.currentApiKeyIndex++;

            const langMap = { 'en': 'English', 'vi': 'Vietnamese', 'auto': 'the native target language' };
            const targetLang = langMap[tl] || tl;
            const prompt = `You are an expert academic translator. Translate the following scientific text into ${targetLang}. Maintain academic tone.
CRITICAL INSTRUCTION: If the text consists primarily of table data, numerical charts, journal footnotes, copyright notices (e.g. IEEE), page numbers, author affiliations, or references, YOU MUST NOT TRANSLATE IT. You must output EXACTLY the word "[SKIP]" and nothing else.

ONLY output the translation or "[SKIP]". No explanations.

Text to translate:
${text}`;

            const body = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { temperature: 0.1 } // Độ sáng tạo thấp để dịch sát nghĩa
            };

            let url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            let response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            // Xử lý lỗi 429 Quota Exceeded / Rate Limit
            if (response.status === 429) {
                if (retryCount < 10) {
                    let waitTime = 0;

                    // Nếu đã thử qua một vòng tất cả các key mà vẫn lỗi -> Bắt đầu chờ (Backoff)
                    if (retryCount >= keyList.length - 1) {
                        const backoffIndex = retryCount - (keyList.length - 1);
                        // Thời gian chờ tăng dần: 5s, 10s, 20s, 40s, tối đa 60s
                        waitTime = Math.min(5000 * Math.pow(2, backoffIndex), 60000);
                    }

                    if (waitTime > 0) {
                        await new Promise(resolve => setTimeout(resolve, waitTime));
                    }
                    return translateGemini(text, sl, tl, retryCount + 1);
                } else {
                    throw new Error("Tất cả các API Key của bạn đều đã cạn kiệt dung lượng. Vui lòng chờ vài phút rồi nhấn dịch lại.");
                }
            }

            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                throw new Error(err.error?.message || `Lỗi từ Gemini (Mã: ${response.status})`);
            }

            const data = await response.json();
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                return data.candidates[0].content.parts[0].text;
            }
            return "[Gemini không trả về kết quả hợp lệ]";
        }

        // --- MAIN PROCESS ---
        async function startTranslation() {
            const engine = document.getElementById('engine-select').value;
            const isGemini = engine.startsWith('gemini');

            if (isGemini) {
                const key = localStorage.getItem('gemini_api_key');
                if (!key) {
                    alert(`Bạn cần điền và Đăng nhập API Key của Gemini trước khi bắt đầu!`);
                    document.getElementById('gemini-key-box').scrollIntoView();
                    return;
                }
            }

            settingsArea.style.display = 'none';
            liveArea.style.display = 'block';

            const statusText = document.getElementById('status-text');
            const outputDiv = document.getElementById('bilingual-output');
            outputDiv.innerHTML = '';
            bilingualResults = [];

            const file = fileInput.files[0];
            const ext = file.name.split('.').pop().toLowerCase();
            const sl = document.getElementById('source-lang').value;
            const tl = document.getElementById('target-lang').value;

            try {
                statusText.textContent = "Đang đọc nội dung tệp (Trích xuất chữ)...";
                let text = '';
                if (ext === 'pdf') { text = await extractTextFromPDF(file); }
                else if (ext === 'docx') { text = await extractTextFromDocx(file); }

                statusText.textContent = "Đang phân tích và xử lý câu...";
                // Gom nhóm 1000 ký tự để chia nhỏ đoạn song ngữ dễ đọc theo đúng ý bạn
                const maxLength = 1000;
                const chunks = chunkText(text, maxLength);

                if (chunks.length === 0) {
                    statusText.textContent = "Tệp không có văn bản nào có thể đọc được!";
                    return;
                }

                statusText.textContent = isGemini
                    ? `✨ AI ${engine === 'gemini-pro' ? 'Pro' : 'Flash'} đang tiến hành dịch thuật hàn lâm`
                    : "🌐 Google đang tiến hành dịch trực tiếp";

                isPaused = false;
                document.getElementById('pause-btn').style.display = 'flex';
                document.getElementById('pause-text').textContent = "Tạm dừng";
                document.getElementById('pause-btn').querySelector('i').className = "fa-solid fa-pause";

                for (let i = 0; i < chunks.length; i++) {
                    while (isPaused) {
                        await new Promise(r => setTimeout(r, 500));
                    }

                    const sourceText = chunks[i];

                    const box = document.createElement('div');
                    box.className = 'bilingual-box';
                    box.innerHTML = `
                        <div class="source-text">${wrapSentences(sourceText)}</div>
                        <div class="target-text"><span class="loading-text"><i class="fa-solid fa-spinner fa-spin"></i> Đang phân tích và dịch...</span></div>
                    `;
                    outputDiv.appendChild(box);
                    outputDiv.scrollTop = outputDiv.scrollHeight;

                    let targetText = '';
                    try {
                        if (isGemini) {
                            let modelStr = 'gemini-3.1-flash-lite';
                            let waitTime = 4000; // 15 câu/phút -> Chờ 4 giây
                            const keysCount = Math.max(1, (localStorage.getItem('gemini_api_key') || '').split(',').filter(k => k.trim()).length);


                            targetText = await translateGemini(sourceText, sl === 'auto' ? 'auto' : sl, tl, 0, modelStr);

                            waitTime = Math.max(1000, waitTime / keysCount);

                            if (i < chunks.length - 1) await new Promise(r => setTimeout(r, waitTime));
                        } else {
                            targetText = await translateGoogle(sourceText, sl === 'auto' ? 'auto' : sl, tl);
                            // Chờ 0.5s đối với Google Translate API miễn phí
                            if (i < chunks.length - 1) await new Promise(r => setTimeout(r, 500));
                        }
                    } catch (err) {
                        targetText = `<span class="error-text">[LỖI]: ${err.message}</span>`;
                    }

                    // Lệnh bí mật từ AI: Nếu là câu rác (chỉ toàn bản quyền/bảng biểu), xóa nó khỏi giao diện luôn
                    if (targetText.trim() === '[SKIP]') {
                        outputDiv.removeChild(box);
                    } else {
                        box.querySelector('.target-text').innerHTML = wrapSentences(targetText);
                        bilingualResults.push({ source: sourceText, target: targetText });
                    }

                    const progressPercent = Math.round(((i + 1) / chunks.length) * 100);
                    document.getElementById('progress-bar').style.width = `${progressPercent}%`;
                    document.getElementById('progress-text').textContent = `${progressPercent}% (${i + 1}/${chunks.length})`;
                }

                statusText.textContent = "Tuyệt vời! Dịch thuật hoàn tất.";
                document.getElementById('pause-btn').style.display = 'none';
                document.getElementById('download-btn').style.display = 'block';

            } catch (error) {
                console.error(error);
                document.getElementById('pause-btn').style.display = 'none';
                statusText.innerHTML = `<span class="error-text">Đã xảy ra lỗi hệ thống: ${error.message}</span>`;
            }
        }

                                ${item.target}
                            </div>
                        </div>
                `;
            });

            htmlContent += `
                    </div>
                </body>
                </html>
            `;

            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;

            const originalName = document.getElementById('file-name').textContent;
            const nameWithoutExt = originalName.substring(0, originalName.lastIndexOf('.')) || originalName;

            a.download = `${nameWithoutExt}_Song_Ngu.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
